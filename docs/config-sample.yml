profiles:
  # List of profiles
  - name: files
    target: 'D:\backup\' # Target directory for the backup
    sources:
      # List of source directories and/or files
      - path: 'C:\Users\user\Downloads\'
        recursive: false # default = true
      - path: 'C:\Users\user\Documents\'
        recursive: true
        exclude:
          # Optional list of files and/or folders to exclude from the parent directory
          - 'subfolder1\'
          - 'subfolder2\'
        # include_globs / exclude_globs: optional glob patterns, applied in addition to 'exclude'
    retention:
      # Optional tiered retention policy for `vara prune`. Omit this section entirely
      # to leave pruning unavailable for this profile until configured.
      keep_daily: 14
      keep_weekly: 8
      keep_monthly: 12
      keep_yearly: 3
  - name: photos
    target: 'D:\photos\'
    sources:
      - path: 'C:\Users\user\Pictures\'
      - path: 'C:\Users\user\photos_db.db'
